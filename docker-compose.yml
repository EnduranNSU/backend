services:
  db:
    image: postgres:16
    env_file:
      - backend/.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - backend/.env
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"
      - "9003:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  setup_db:
    build: backend
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: "bash ./setup.sh"
    restart: "no"

  llm:
    build: llm
    env_file:
      - .env
    ports:
      - "9100:9000"
    restart: unless-stopped
    command: "pdm run start"

  backend:
    build: backend
    ports:
      - "8000:8000"
    depends_on:
      setup_db:
        condition: service_completed_successfully
    restart: unless-stopped
    command: "pdm run start"

  cv_service:
    build: cv_service
    ports:
      - "9090:9090"
    restart: unless-stopped
    command: "pdm run start"

  setup_qdrant:
    build: rag
    depends_on:
      qdrant:
        condition: service_healthy
    command: "pdm run populate_exercises"
    restart: "no"

  retriever:
    build: rag
    env_file:
      - .env
    ports:
      - "8888:8888"
    depends_on:
      setup_qdrant:
        condition: service_completed_successfully
      llm:
        condition: service_started
    restart: unless-stopped
    command: "pdm run start"

  agent:
    build: agent
    env_file:
      - .env
    ports:
      - "8085:8080"
    depends_on:
      - backend
      - cv_service
      - llm
      - retriever
    restart: unless-stopped
    command: "pdm run start"

  gateway:
    build: gateway
    ports:
      - "8001:8001"
    depends_on:
      - backend
      - agent
      - cv_service
      - llm
      - retriever
    restart: unless-stopped
    command: "pdm run start"

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ../end-frontend/dist/spa:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
  qdrant_storage:
